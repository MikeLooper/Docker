server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Docker embedded DNS, resolved at request time so a stopped API container does not block startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /healthcheck {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # The path segment is the published host port, kept in sync with proxy.conf.json used by "ng serve".
    # The upstream port is the container's internal listener, which differs from the published port.
    location ^~ /api/11001/ {
        set $upstream_dotnet_sqlserver "pilot-api-dotnet-mssql:8080";
        rewrite ^/api/11001/(.*)$ /$1 break;
        proxy_pass http://$upstream_dotnet_sqlserver;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ^~ /api/11101/ {
        set $upstream_dotnet_postgresql "pilot-api-dotnet-postgres:8080";
        rewrite ^/api/11101/(.*)$ /$1 break;
        proxy_pass http://$upstream_dotnet_postgresql;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ^~ /api/11201/ {
        set $upstream_java_sqlserver "pilot-api-java-mssql:11201";
        rewrite ^/api/11201/(.*)$ /$1 break;
        proxy_pass http://$upstream_java_sqlserver;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ^~ /api/11301/ {
        set $upstream_java_postgresql "pilot-api-java-postgres:11301";
        rewrite ^/api/11301/(.*)$ /$1 break;
        proxy_pass http://$upstream_java_postgresql;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ^~ /api/11401/ {
        set $upstream_python_sqlserver "pilot-api-python-mssql:11401";
        rewrite ^/api/11401/(.*)$ /$1 break;
        proxy_pass http://$upstream_python_sqlserver;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ^~ /api/11501/ {
        set $upstream_python_postgresql "pilot-api-python-postgres:11501";
        rewrite ^/api/11501/(.*)$ /$1 break;
        proxy_pass http://$upstream_python_postgresql;
        include /etc/nginx/pilot-proxy-headers.conf;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Angular is a single page application, so unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
