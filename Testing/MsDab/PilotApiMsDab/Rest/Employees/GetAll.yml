info:
  name: GetAll
  type: http
  seq: 1

http:
  method: GET
  url: "{{Host}}api/{{entity}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return rows", function () {
          const resBody = res.getBody();

          expect(resBody.value).to.be.an("array");
          expect(resBody.value.length).to.be.greaterThan(0);
        });

        test("should expose PascalCase fields", function () {
          const item = res.getBody().value[0];

          expect(item).to.have.property("EmployeeID");
          expect(item).to.have.property("LastName");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
