info:
  name: GetAll_Paged
  type: http
  seq: 3

http:
  method: GET
  url: "{{Host}}api/{{entity}}?$first=2"
  params:
    - name: $first
      value: "2"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Save the continuation link for the NextPage request.
        bru.setVar("nextLink", res.getBody().nextLink);
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return one page with a nextLink", function () {
          const resBody = res.getBody();

          expect(resBody.value).to.have.lengthOf(2);
          expect(resBody.nextLink).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
