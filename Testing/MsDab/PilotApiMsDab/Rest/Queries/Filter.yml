info:
  name: Filter
  type: http
  seq: 1

http:
  method: GET
  url: "{{Host}}api/Products?$filter=CategoryID eq 1"
  params:
    - name: $filter
      value: "CategoryID eq 1"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return only matching rows", function () {
          const rows = res.getBody().value;

          expect(rows.length).to.be.greaterThan(0);
          rows.forEach(function (row) {
            expect(row.CategoryID).to.equal(1);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
