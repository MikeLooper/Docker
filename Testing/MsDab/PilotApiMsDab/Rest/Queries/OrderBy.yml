info:
  name: OrderBy
  type: http
  seq: 3

http:
  method: GET
  url: "{{Host}}api/Products?$orderby=ProductName desc&$select=ProductID,ProductName&$first=10"
  params:
    - name: $orderby
      value: "ProductName desc"
      type: query
    - name: $select
      value: "ProductID,ProductName"
      type: query
    - name: $first
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return rows in descending name order", function () {
          const names = res.getBody().value.map(function (row) { return row.ProductName; });
          const sorted = names.slice().sort().reverse();

          expect(names).to.have.lengthOf(10);
          expect(names).to.deep.equal(sorted);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
