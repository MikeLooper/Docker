info:
  name: MissingKey
  type: http
  seq: 5

http:
  method: GET
  url: "{{Host}}api/Products/ProductID/999999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // DAB answers a lookup by a key that does not exist with 200 and an empty array.
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return no rows", function () {
          expect(res.getBody().value).to.have.lengthOf(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
