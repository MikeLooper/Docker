info:
  name: Select
  type: http
  seq: 2

http:
  method: GET
  url: "{{Host}}api/Products?$select=ProductID,ProductName&$first=5"
  params:
    - name: $select
      value: "ProductID,ProductName"
      type: query
    - name: $first
      value: "5"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return only the selected fields", function () {
          const rows = res.getBody().value;

          expect(rows).to.have.lengthOf(5);
          rows.forEach(function (row) {
            expect(Object.keys(row).sort()).to.deep.equal(["ProductID", "ProductName"]);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
