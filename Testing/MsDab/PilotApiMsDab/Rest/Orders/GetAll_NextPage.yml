info:
  name: GetAll_NextPage
  type: http
  seq: 4

http:
  method: GET
  url: "{{nextLink}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return the next page", function () {
          const resBody = res.getBody();

          expect(resBody.value).to.be.an("array");
          expect(resBody.value.length).to.be.greaterThan(0);
          expect(resBody.value.length).to.be.at.most(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
