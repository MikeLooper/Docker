info:
  name: ToolsList
  type: http
  seq: 2

http:
  method: POST
  url: "{{Host}}mcp"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept
      value: "application/json, text/event-stream"
    - name: Mcp-Session-Id
      value: "{{mcpSessionId}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/list"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Streamable HTTP may answer with a server-sent event: "event: message\ndata: {...}".
        function parseMcp(body) {
          if (typeof body !== "string") return body;
          const line = body.split(/\r?\n/).find(function (l) { return l.indexOf("data:") === 0; });
          return JSON.parse(line ? line.substring(5) : body);
        }

        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should list the DAB tools", function () {
          const message = parseMcp(res.getBody());
          const names = message.result.tools.map(function (t) { return t.name; });

          expect(names).to.include("describe_entities");
          expect(names).to.include("read_records");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
