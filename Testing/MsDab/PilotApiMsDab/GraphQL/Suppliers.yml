info:
  name: Suppliers
  type: http
  seq: 8

http:
  method: POST
  url: "{{Host}}graphql"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "query": "query { suppliers(first: 2) { items { SupplierID CompanyName } hasNextPage endCursor } }"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return success", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("should return items without errors", function () {
          const resBody = res.getBody();

          expect(resBody.errors).to.be.undefined;

          const items = resBody.data.suppliers.items;
          expect(items).to.have.lengthOf(2);
          expect(items[0]).to.have.property("SupplierID");
          expect(items[0]).to.have.property("CompanyName");
          expect(resBody.data.suppliers.hasNextPage).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
