# Collector configuration routing to the LGTM stack

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Self-scrape the collector's own internal telemetry (otelcol_* metrics),
  # exposed by default on :8888, so the "OpenTelemetry Collector" and
  # "Opentelemetry Collector Data Flow" Grafana dashboards have data to show.
  # Without this, those dashboards' otelcol_* queries always return empty.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Batch processor for efficient data transfer
  batch:
    timeout: 5s
    send_batch_size: 512

  # Add resource attributes for better correlation
  resource:
    attributes:
      - key: environment
        value: local-dev
        action: upsert

exporters:
  # Send traces to Tempo via OTLP
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Send metrics to Mimir via Prometheus remote write
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Send logs to Loki via its native OTLP HTTP endpoint
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Keep debug output for development visibility
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [resource, batch]
      exporters: [prometheusremotewrite/mimir, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/loki, debug]
