  # Grafana Tempo configuration for local development

# Server configuration
server:
  http_listen_port: 3200

# Distributor receives traces from the Collector
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Storage configuration using local filesystem
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Metrics generator creates span metrics for RED dashboards
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
  processor:
    # Adds client_service_instance_id and server_service_instance_id to the service graph,
    # so the Pilot-Workflows dashboard can tell the mssql and postgres instances apart.
    # The User-Agent (server_user_agent_original, or server_http_user_agent from older
    # semantic conventions) names the caller where Tempo only knows it as `user`.
    service_graphs:
      dimensions: [service.instance.id, user_agent.original, http.user_agent]
      enable_client_server_prefix: true

# Enable metrics-generator processors for the default tenant
overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
