    - utility-api-dotnet:
        - utility-api-dotnet (SQL Server):
            href: http://localhost:11601/swagger
            description: Utility .NET API for SQL Server development and testing.
            icon: sh-asp-net-core.png
            container: utility-api-dotnet-mssql
            widget:
                type: customapi
                url: http://utility-api-dotnet-mssql:8080/about?show-details=false
                method: GET
                mappings:
                    - field: apiVersion
                      label: Api Version
                    - field: deployDate
