    - pilot-api-msdab:
        - pilot-api-msdab (SQL Server):
            href: http://localhost:11151/swagger
            description: Microsoft Data API builder (REST, GraphQL, MCP) for SQL Server.
            icon: mdi-database-cog
            container: pilot-api-msdab-mssql
            widget:
                type: customapi
                url: http://pilot-api-msdab-mssql:5000/health
                method: GET
                mappings:
                    - field: status
                      label: Status
                    - field: version
                      label: DAB Version

