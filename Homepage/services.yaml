# https://gethomepage.dev/configs/services/
# https://gethomepage.dev/widgets/
# https://gethomepage.dev/widgets/services/customapi/

- Dashboards:
    - Dozzle:
        href: http://localhost:11121/
        description: Dozzle dashboard for monitoring Docker containers.
        icon: doozle.png
        container: local-dozzle

    - UptimeKuma:
        href: http://localhost:3001/
        description: UptimeKuma dashboard for monitoring website uptime.
        icon: uptime-kuma.png
        container: local-uptimekuma

- Databases:
    - SQL Server:
        href: http://localhost:1433/
        description: Local SQL Server database for development and testing.
        icon: microsoft-sql-server.png
        container: local-mssql

    - PostgreSQL:
        href: http://localhost:5432/
        description: Local PostgreSQL database for development and testing.
        icon: postgresql.png
        container: local-postgres

- UIs:
    - pilot-ui:
        href: http://localhost:11801
        description: Pilot UI for development and testing.
        icon: sh-fizzy.png
        container: pilot-ui

- OTEL:
    - Grafana:
        icon: sh-grafana.png
        href: http://localhost:3000/
        description: Grafana dashboard for monitoring telemetry data.
        container: local-grafana
        widget:
            type: grafana
            version: 2 # optional, default is 1
            url: http://local-grafana:3000
            username: limited_user
            password: user_secure_password 

    - Loki:
        icon: sh-loki.png
        href: http://localhost:3100/
        description: Loki dashboard for monitoring logs.
        container: local-loki

    - Mimir:
        icon: sh-grafana-mimir.png
        href: http://localhost:9009/
        description: Mimir dashboard for monitoring metrics.
        container: local-mimir

    - Tempo:
        icon: sh-homepage.png
        href: http://localhost:3200/
        description: Tempo dashboard for monitoring traces.
        container: local-tempo

    - Collector:
        icon: sh-opentelemetry.png
        href: http://localhost:4318/
        description: OTEL collector.
        container: otel-collector

- APIs:
    - pilot-api-dotnet:
        - pilot-api-dotnet (SQL Server):
            href: http://localhost:11001/swagger
            description: Pilot .NET API for SQL Server development and testing.
            icon: sh-asp-net-core-light.png
            server: local-docker # The docker server
            container: pilot-api-dotnet-mssql
            widget:
                type: customapi
                url: http://pilot-api-dotnet-mssql:8080/about
                method: GET
                mappings:
                    - field: apiVersion
                      label: Api Version
                    - field: deployDate
                      label: Deploy Date

        - pilot-api-dotnet (PostgreSQL):
            href: http://localhost:11101/swagger
            description: Pilot .NET API for PostgreSQL development and testing.
            icon: sh-asp-net-core-light.png
            container: pilot-api-dotnet-postgres
            widget:
                type: customapi
                url: http://pilot-api-dotnet-postgres:8080/about
                method: GET
                mappings:
                    - field: apiVersion
                      label: Api Version
                    - field: deployDate
                      label: Deploy Date

    - pilot-api-java:
        - pilot-api-java (SQL Server):
            href: http://localhost:11201/swagger-ui/index.html
            description: Pilot Java API for SQL Server development and testing.
            icon: sh-java.png
            container: pilot-api-java-mssql
            widget:
